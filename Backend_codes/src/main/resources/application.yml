server:
  port: ${PORT:8080}

# Default active profile for local development
spring:
  profiles:
    active: dev
  application:
    name: personal-ai-backend
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# CORS origins (profile-specific lists in profile files). If empty, CorsConfig will
# rely on allowed origin patterns or profile-aware behavior.
cors:
  allowedOrigins: []

# Upload directory - can be overridden by environment variable UPLOAD_DIR
app:
  upload:
    dir: ${UPLOAD_DIR:uploads}

# AI config is environment/profile specific and will be set in profile files
